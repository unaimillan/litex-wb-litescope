[project]
name = "litex-wb-litescope"
version = "0.1.0"
description = "LiteX Wishbone-bus SoC with UARTBone + LiteScope ILA, built as a standalone single-file Verilog IP core"
readme = "README.md"
authors = [
    { name = "Mike", email = "m.kuskov@innopolis.university" }
]
requires-python = ">=3.12"
dependencies = [
    "migen",
    "litex",
    "litescope",
]

[tool.uv.sources]
migen     = { git = "https://git.m-labs.hk/M-Labs/migen/", rev = "9ddebff9a8c584c62bc51a3a2a27c3336978904c" }
litex     = { git = "https://github.com/enjoy-digital/litex/",     tag = "2026.04" }
litescope = { git = "https://github.com/enjoy-digital/litescope/", tag = "2026.04" }

[project.scripts]
litex-wb-litescope = "litex_wb_litescope:main"
simple-soc         = "litex_wb_litescope.build_soc:main"

[build-system]
requires = ["uv_build>=0.12.6,<0.13.0"]
build-backend = "uv_build"
